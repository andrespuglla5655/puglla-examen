name: CI/CD to VPS with Docker Swarm

on:
  push:
    branches:
      - puglla

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish-deploy:
    runs-on: ubuntu-latest

    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build --if-present

      - name: Docker Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u andrespuglla5655 --password-stdin

      - name: Docker Build
        run: docker build -t puglla-examen:1.0.5 .

      - name: Docker Tag & Push
        run: |
          IMAGE="ghcr.io/andrespuglla5655/puglla-examen"
          docker tag puglla-examen:1.0.5 $IMAGE:1.0.5
          docker tag puglla-examen:1.0.5 $IMAGE:latest
          docker push $IMAGE:1.0.5
          docker push $IMAGE:latest

      - name: Copy stack.yml to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: ${{ env.VPS_SSH_PORT }}
          source: "stack.yml"
          target: "/home/${{ env.VPS_USER }}/deploy"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: ${{ env.VPS_SSH_PORT }}
          script: |
            echo "Deploying..."

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u andrespuglla5655 --password-stdin

            docker pull ghcr.io/andrespuglla5655/puglla-examen:latest

            docker stack deploy --with-registry-auth \
              -c /home/${{ env.VPS_USER }}/deploy/stack.yml puglla
