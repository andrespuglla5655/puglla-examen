name: CI/CD Pipeline

on:
  push:
    branches: [ "puglla" ]

jobs:

  ci:
    name: Run Tests + Build Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: pytest -q

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build image
      run: |
        docker build -t ghcr.io/${{ github.actor }}/proyecto-puglla:1.0.5 .

    - name: Push image
      run: |
        docker push ghcr.io/${{ github.actor }}/proyecto-puglla:1.0.5

  cd:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        port: ${{ secrets.VPS_PORT }}
        key: ${{ secrets.VPS_KEY }}
        script: |
          docker pull ghcr.io/${{ github.actor }}/proyecto-puglla:1.0.5
          docker stack deploy -c /home/${{ secrets.VPS_USER }}/deploy/docker-stack.yml proyecto-puglla
