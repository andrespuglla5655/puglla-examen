name: CI/CD to VPS with Docker Swarm

on:
  push:
    branches:
      - puglla   # tu rama obligatoria del examen

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish-deploy:
    runs-on: ubuntu-latest

    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      IMAGE_NAME: ghcr.io/andrespuglla5655/puglla

    steps:

      # 1️⃣ Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Python (FLASK)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 4️⃣ Ejecutar pruebas
      - name: Run tests
        run: pytest -q

      # 5️⃣ Login GHCR
      - name: Login to GHCR
        run: |
          echo "${{ env.GHCR_PAT }}" | docker login ghcr.io -u andrespuglla5655 --password-stdin

      # 6️⃣ Docker Build
      - name: Docker Build
        run: |
          docker build -t $IMAGE_NAME:1.0.5 .

      # 7️⃣ Docker Push
      - name: Tag & Push Image
        run: |
          docker tag $IMAGE_NAME:1.0.5 $IMAGE_NAME:latest
          docker push $IMAGE_NAME:1.0.5
          docker push $IMAGE_NAME:latest

      # 8️⃣ Copiar stack.yml al VPS
      - name: Copy stack.yml to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: ${{ env.VPS_SSH_PORT }}
          source: "stack.yml"
          target: "/home/${{ env.VPS_USER }}/deploy"

      # 🔟 Deploy en VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: ${{ env.VPS_SSH_PORT }}
          script: |
            echo "${{ env.GHCR_PAT }}" | docker login ghcr.io -u andrespuglla5655 --password-stdin

            docker pull $IMAGE_NAME:latest

            docker stack rm puglla || true
            sleep 10

            docker stack deploy --with-registry-auth -c ~/deploy/stack.yml puglla

            docker service ls
            docker stack ps puglla
