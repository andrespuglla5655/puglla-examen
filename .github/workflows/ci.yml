name: CI/CD Pipeline for GitHub Packages

on:
  push:
    branches:
      - puglla

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Run tests
      - name: Run tests
        run: npm test

      # 5️⃣ Log in to GitHub Container Registry
      - name: Login to GitHub Container Registry
        run: |
          echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 6️⃣ Build Docker image with second surname and version 1.0.5
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/andrespuglla5655/puglla:1.0.5 .
          docker tag ghcr.io/andrespuglla5655/puglla:1.0.5 ghcr.io/andrespuglla5655/puglla:latest

      # 7️⃣ Publish to GitHub Packages
      - name: Publish to GitHub Packages
        run: |
          docker push ghcr.io/andrespuglla5655/puglla:1.0.5
          docker push ghcr.io/andrespuglla5655/puglla:latest

      # 8️⃣ Verify package publication
      - name: Verify package publication
        run: |
          echo "Package published successfully to:"
          echo "https://github.com/andrespuglla5655/puglla/pkgs/container/puglla"
